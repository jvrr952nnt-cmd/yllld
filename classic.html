<style>
 :root{
  --ink:#111318; --sub:#8b8f9a; --line:rgba(17,19,24,.06); --card:#ffffff; --bg:#f5f5f7;
  --glow:radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, rgba(255,255,255,0) 60%);
  --shadow:0 1px 2px rgba(17,19,24,.04), 0 12px 24px -18px rgba(17,19,24,.35);
  --shadow-h:0 2px 4px rgba(17,19,24,.05), 0 18px 32px -18px rgba(17,19,24,.45);
  --play:#FB7299;
 }
 [data-theme="dark"]{
  --ink:#f3f4f6; --sub:#9aa0ab; --line:rgba(255,255,255,.07); --card:#181a1f; --bg:#0a0b0e;
  --glow:radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 62%);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 16px 30px -22px rgba(0,0,0,.95);
  --shadow-h:0 2px 6px rgba(0,0,0,.55), 0 20px 36px -20px rgba(0,0,0,1);
 }
 *{box-sizing:border-box}
 body{
  margin:0;min-height:100vh;background:var(--glow), var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;padding:76px 20px 64px;display:flex;justify-content:center;
 }
 .wrap{width:100%;max-width:880px;animation:rise .7s cubic-bezier(.22,.61,.36,1) both}
 @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
 .theme-btn{
  position:fixed;top:18px;left:18px;z-index:9;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
  transition:transform .25s cubic-bezier(.22,.61,.36,1), background-color .25s;
 }
 .theme-btn:active{transform:scale(.94)}
 .theme-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
 .theme-btn .moon{display:none}
 [data-theme="dark"] .theme-btn .moon{display:block}
 [data-theme="dark"] .theme-btn .sun{display:none}
 .top{display:flex;align-items:center;gap:10px;margin-bottom:22px}
 .back{
  width:36px;height:36px;flex:0 0 36px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;
  text-decoration:none;box-shadow:var(--shadow);transition:transform .25s;
 }
 .back:hover{transform:translateX(-2px)}
 .back svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
 .top h1{font-size:21px;font-weight:650;margin:0;letter-spacing:.01em}
 .top .sub{font-size:12px;color:var(--sub);margin-left:auto;letter-spacing:.02em;text-align:right}
 .grid{display:grid;grid-template-columns:1fr;gap:14px}
 @media (min-width:700px){ .grid{grid-template-columns:1fr 1fr} }
 .card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:var(--shadow);transition:transform .28s cubic-bezier(.22,.61,.36,1), box-shadow .28s;
 }
 .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
 .card.playing{grid-column:1 / -1}
 .card.playing:hover{transform:none}
 .stage{position:relative;width:100%;aspect-ratio:16/9;background:#0d0f13;cursor:pointer;overflow:hidden}
 .stage img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.22,.61,.36,1)}
 .stage:hover img{transform:scale(1.03)}
 .stage .veil{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.52) 0%, rgba(0,0,0,.12) 46%, rgba(0,0,0,.16) 100%)}
 .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b929c;font-size:12px;letter-spacing:.04em}
 .stage .pbtn{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.28);
  transition:transform .3s cubic-bezier(.22,.61,.36,1);
 }
 .stage:hover .pbtn{transform:translate(-50%,-50%) scale(1.06)}
 .pbtn svg{width:18px;height:18px;fill:#111318;stroke:none;margin-left:2px}
 .badge{
  position:absolute;left:10px;bottom:10px;font-size:11px;color:#fff;letter-spacing:.03em;
  background:rgba(0,0,0,.42);backdrop-filter:blur(6px);padding:3px 9px;border-radius:999px;
 }
 .rank{
  position:absolute;right:10px;top:10px;font-size:11px;color:#fff;background:rgba(0,0,0,.42);
  backdrop-filter:blur(6px);padding:3px 9px;border-radius:999px;letter-spacing:.04em;
 }
 .close{
  position:absolute;right:10px;top:10px;z-index:6;width:32px;height:32px;border-radius:50%;border:0;
  cursor:pointer;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
 }
 .close:hover{background:rgba(0,0,0,.72)}
 .meta{padding:13px 15px 14px}
 .meta h2{font-size:14.5px;font-weight:600;line-height:1.45;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 .stats{margin:7px 0 0;font-size:11.5px;color:var(--sub);letter-spacing:.02em;display:flex;gap:10px;flex-wrap:wrap}
 .acts{display:flex;align-items:center;gap:8px;margin-top:12px}
 .btn{
  font-size:12.5px;text-decoration:none;border-radius:11px;padding:7px 13px;border:1px solid var(--line);
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:background-color .2s, border-color .2s, transform .2s;font-family:inherit;
 }
 .btn.play{background:var(--play);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 8px 18px -12px rgba(251,114,153,.9)}
 .btn.play:hover{transform:translateY(-1px)}
 .btn.ghost{background:transparent;color:var(--ink)}
 .btn.ghost:hover{border-color:rgba(120,130,150,.3);background:rgba(120,130,150,.06)}
 .btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8}
 footer{text-align:center;color:var(--sub);opacity:.65;font-size:11.5px;margin-top:30px}
 ::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
 ::view-transition-old(root){z-index:1}
 ::view-transition-new(root){z-index:2}
 @media (prefers-reduced-motion:reduce){ .wrap{animation:none} .card,.stage img,.theme-btn{transition:none} }
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" aria-label="切换深色模式" title="切换深色模式" aria-pressed="false">
  <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>

</button>

<div class="wrap">
 <div class="top">
  <a class="back" href="index.html" aria-label="返回主页"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
  <h1>经典作品</h1>
  <span class="sub" id="subline">按播放量排序</span>
 </div>
 <div class="grid" id="grid"></div>
 <footer>© 2026 YLLLD_ · 视频版权归 YLLLD_ 所有</footer>
</div>

<script>
 var VIDEOS = [
  {bv:'BV1eUxE6kEiQ', title:'此视频…致敬龙腾猫跃', play:7098, dur:'04:05', date:'11月1日', cover:'41df82dc8bbb6100f68876208b87dc69d9168a60'},
  {bv:'BV12doZBJE8k', title:'爱是一场伟大的冒险', play:6396, dur:'01:57', date:'4月26日', cover:'a84c42af6707f75fb3f8696757be525ecf31177c'},
  {bv:'BV1nSDkB2ESU', title:'当你不知道作文怎么写时，不妨看看影视飓风', play:5021, dur:'00:28', date:'4月11日', cover:'55cc1d8c98fb7743899f5022d09a927120fafe0f'},
  {bv:'BV1SFJU6KEq4', title:'和solo双排并取得3连胜', play:2448, dur:'25:54', date:'10月16日', cover:'03e7cad21601155a24a5717af4f64c42953c92a9'},
  {bv:'BV1FXoLBpEZ8', title:'什么是影视飓风？「无限进步！」', play:1877, dur:'06:11', date:'4月24日', cover:'808f159eb57a43251f748a8ee399b64358b17027'},
  {bv:'BV1Uvyvz3EvQ', title:'那些电影史上无法超越的经典片段重制版', play:1612, dur:'03:54', date:'11月22日', cover:'3dfe299f6694e41eb591a9aef7fd644ac91bd9b0'},
  {bv:'BV1fqpu6EE6j', title:'[SY_Wheat on YouTube] 非人类的稳定 telly', play:1466, dur:'03:22', date:'10月10日', cover:'07efdbb4fefe1389b47cf568ac4681915c816550'},
  {bv:'BV114s26qEvJ', title:'8分钟solo全局材质包分享', play:1013, dur:'08:09', date:'11月18日', cover:'6e20754ff7078c5efd3de3ff464094b72da74223'}
 ];
 var host = 'https://www.bilibili.com/video/';
 var CDN = 'https://i1.hdslb.com/bfs/archive/';
 var fmt = function(n){ n = Number(n)||0; return n >= 10000 ? (n/10000).toFixed(1) + ' 万' : String(n); };

 var grid = document.getElementById('grid');
 VIDEOS.forEach(function(v, i){
  var card = document.createElement('article');
  card.className = 'card';
  card.dataset.bv = v.bv;
  var direct = CDN + v.cover + '.jpg';
  var proxied = 'https://wsrv.nl/?url=i1.hdslb.com/bfs/archive/' + v.cover + '.jpg&w=640&fit=cover&output=jpg';
  card.innerHTML =
   '<div class="stage">' +
     '<img src="' + direct + '" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.onerror=null;this.src=\'' + proxied + '\'" />' +
     '<div class="veil"></div>' +
     '<div class="pbtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>' +
     '<span class="badge">' + v.dur + '</span>' +
     '<span class="rank">No.' + (i+1) + '</span>' +
   '</div>' +
   '<div class="meta">' +
     '<h2>' + v.title + '</h2>' +
     '<div class="stats"><span data-k="play">' + fmt(v.play) + ' 播放</span><span>' + v.date + '</span><span>' + v.bv + '</span></div>' +
     '<div class="acts">' +
       '<button class="btn play" type="button">在线观看</button>' +
       '<a class="btn ghost" href="' + host + v.bv + '" target="_blank" rel="noopener">在 B 站看' +
         '<svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H9M17 7v8"/></svg></a>' +
     '</div>' +
   '</div>';
  grid.appendChild(card);

  var stage = card.querySelector('.stage');
  var btn = card.querySelector('.btn.play');
  var coverHTML = stage.innerHTML;

  var open = function(){
   if (card.classList.contains('playing')) return;
   card.classList.add('playing');
   stage.innerHTML = '<div class="loading">正在加载播放器…</div><iframe src="https://player.bilibili.com/player.html?bvid=' + v.bv +
     '&page=1&high_quality=1&danmaku=0&autoplay=1" onload="var l=this.parentNode.querySelector(\'.loading\');if(l)l.remove()" scrolling="no" frameborder="0" ' +
     'allowfullscreen="true" allow="autoplay; fullscreen; picture-in-picture" ' +
     'style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000"></iframe>' +
     '<button class="close" type="button" aria-label="收起">✕</button>';
   stage.style.cursor = 'default';
   btn.textContent = '播放中';
   card.scrollIntoView({behavior:'smooth', block:'center'});
   stage.querySelector('.close').addEventListener('click', function(ev){
    ev.stopPropagation();
    card.classList.remove('playing');
    stage.innerHTML = coverHTML;
    stage.style.cursor = 'pointer';
    btn.textContent = '在线观看';
   });
  };
  stage.addEventListener('click', open);
  btn.addEventListener('click', open);
 });

 /* 播放量：读取自动任务生成的 stats.json（同源，不依赖第三方代理），并按播放量重排 */
 (function(){
  var subline = document.getElementById('subline');
  var VIEW = {};
  var pad = function(n){ return (n<10?'0':'') + n; };

  function apply(bv, item){
   var card = document.querySelector('.card[data-bv="' + bv + '"]');
   if (!card || !item) return false;
   if (item.view) {
    VIEW[bv] = item.view;
    var st = card.querySelector('[data-k="play"]');
    if (st) st.textContent = fmt(item.view) + ' 播放';
   }
   if (item.title) {
    var h2 = card.querySelector('h2');
    if (h2) h2.textContent = item.title;
   }
   return true;
  }

  function resort(){
   var cards = [].slice.call(grid.children);
   cards.sort(function(a, b){ return (VIEW[b.dataset.bv] || 0) - (VIEW[a.dataset.bv] || 0); });
   cards.forEach(function(c, i){
    grid.appendChild(c);
    var rk = c.querySelector('.rank');
    if (rk) rk.textContent = 'No.' + (i + 1);
   });
  }

  fetch('stats.json?t=' + Date.now(), {cache:'no-store'})
   .then(function(r){ return r.ok ? r.json() : null; })
   .then(function(j){
    if (!j || !j.items) { subline.textContent = '按播放量排序 · 快照数据'; return; }
    Object.keys(j.items).forEach(function(bv){ apply(bv, j.items[bv]); });
    resort();
    if (j.updated) {
     var d = new Date(j.updated);
     subline.textContent = '按播放量排序 · 更新于 ' +
       (d.getMonth() + 1) + '-' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    } else {
     subline.textContent = '按播放量排序 · 数据已同步';
    }
   })
   .catch(function(){ subline.textContent = '按播放量排序 · 快照数据'; });
 })();
</script>

<script>
 (function(){
  var root = document.documentElement;
  var btn = document.getElementById('themeBtn');
  var setTheme = function(next){
   root.dataset.theme = next;
   try { localStorage.setItem('yllld-theme', next); } catch (e) {}
   btn.setAttribute('aria-pressed', next === 'dark' ? 'true' : 'false');
   var meta = document.querySelector('meta[name="theme-color"]');
   if (meta) meta.setAttribute('content', next === 'dark' ? '#0a0b0e' : '#f5f5f7');
  };
  btn.setAttribute('aria-pressed', root.dataset.theme === 'dark' ? 'true' : 'false');
  btn.addEventListener('click', function(){
   var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
   if (!document.startViewTransition) { setTheme(next); return; }
   var r = btn.getBoundingClientRect();
   var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
   var radius = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
   var vt = document.startViewTransition(function(){ setTheme(next); });
   vt.ready.then(function(){
    document.documentElement.animate(
     { clipPath: ['circle(0px at ' + cx + 'px ' + cy + 'px)', 'circle(' + radius + 'px at ' + cx + 'px ' + cy + 'px)'] },
     { duration: 560, easing: 'cubic-bezier(.35,.05,.2,1)', pseudoElement: '::view-transition-new(root)', fill: 'both' }
    );
   });
  });
 })();
</script>
