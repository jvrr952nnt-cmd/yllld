<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YLLLD_</title>
<meta name="description" content="YLLLD_ — 游戏内容创作者。B站 / 抖音 / 小红书。" />
<style>
 :root{
  --ink:#111318;
  --sub:#8b8f9a;
  --line:rgba(17,19,24,.06);
  --card:#ffffff;
  --bg:#f5f5f7;
 }
 *{box-sizing:border-box}
 body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, rgba(255,255,255,0) 60%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;align-items:center;
  padding:56px 20px;
 }
 .page{width:100%;max-width:420px;animation:rise .7s cubic-bezier(.22,.61,.36,1) both}
 @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
 .head{text-align:center;padding:8px 0 26px}
 .avatar{
  width:92px;height:92px;border-radius:50%;object-fit:cover;background:#fff;
  box-shadow:0 0 0 4px #fff, 0 10px 28px -12px rgba(17,19,24,.35);
 }
 h1{font-size:22px;font-weight:650;letter-spacing:.01em;margin:16px 0 0}
 .tagline{margin:6px 0 0;color:var(--sub);font-size:13.5px}
 .chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:14px}
 .chips span{
  font-size:11.5px;color:#6f7480;background:#fff;border:1px solid var(--line);
  padding:3px 11px;border-radius:999px;letter-spacing:.04em;
 }
 .links{display:flex;flex-direction:column;gap:10px;margin-top:6px}
 .row{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:12px 16px 12px 12px;text-decoration:none;color:var(--ink);
  box-shadow:0 1px 2px rgba(17,19,24,.04), 0 12px 24px -18px rgba(17,19,24,.35);
  transition:transform .28s cubic-bezier(.22,.61,.36,1), box-shadow .28s, border-color .28s;
 }
 .row:hover{
  transform:translateY(-2px);
  box-shadow:0 2px 4px rgba(17,19,24,.05), 0 18px 32px -18px rgba(17,19,24,.45);
  border-color:rgba(17,19,24,.14);
 }
 .row:active{transform:translateY(0) scale(.995)}
 .ico{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
 .ico svg{width:20px;height:20px;fill:none;stroke-width:1.6;stroke-linecap:round}
 .txt{min-width:0}
 .txt b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
 .arrow{margin-left:auto;color:#c3c6cf;display:flex;align-items:center}
 .num{margin-left:auto;font-size:13px;color:#8b8f9a;letter-spacing:.02em}
 .num + .arrow{margin-left:10px}
 .arrow svg{width:15px;height:15px}
 .ico.bili{background:#fff1f5}
 .ico.bili svg{stroke:#FB7299}
 .ico.dy{background:#f1f2f5}
 .ico.dy svg{stroke:#161823}
 .ico.xhs{background:#fff0f2}
 .ico.xhs svg{stroke:#FF2E4D}
 .ico.qq{background:#f0f5ff}
 .ico.qq svg{stroke:#3B82F6}
 .qq.flat{box-shadow:none;background:transparent;border-style:dashed;border-color:rgba(17,19,24,.12)}
 footer{text-align:center;color:#b6b9c1;font-size:11.5px;margin-top:28px}
 @media (prefers-reduced-motion:reduce){ .page{animation:none} .row{transition:none} }
</style>
</head>
