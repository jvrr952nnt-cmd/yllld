<style>
 :root{
  --ink:#111318;
  --sub:#8b8f9a;
  --line:rgba(17,19,24,.06);
  --card:#ffffff;
  --chip:#ffffff;
  --bg:#f5f5f7;
  --ico1:#fff1f5; --ico2:#f1f2f5; --ico3:#fff0f2; --ico4:#f0f5ff;
  --glow:radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, rgba(255,255,255,0) 60%);
  --shadow:0 1px 2px rgba(17,19,24,.04), 0 12px 24px -18px rgba(17,19,24,.35);
  --shadow-h:0 2px 4px rgba(17,19,24,.05), 0 18px 32px -18px rgba(17,19,24,.45);
 }
 [data-theme="dark"]{
  --ink:#f3f4f6;
  --sub:#9aa0ab;
  --line:rgba(255,255,255,.07);
  --card:#181a1f;
  --chip:#1d2026;
  --bg:#0a0b0e;
  --ico1:#2a1a20; --ico2:#1e2126; --ico3:#2a1a1e; --ico4:#171d28;
  --glow:radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 62%);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 16px 30px -22px rgba(0,0,0,.95);
  --shadow-h:0 2px 6px rgba(0,0,0,.55), 0 20px 36px -20px rgba(0,0,0,1);
 }
 *{box-sizing:border-box}
 body{
  margin:0;min-height:100vh;
  background:var(--glow), var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;align-items:center;
  padding:76px 20px 56px;
 }
 .page{width:100%;max-width:420px;animation:rise .7s cubic-bezier(.22,.61,.36,1) both}
 @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

 .theme-btn{
  position:fixed;top:18px;left:18px;z-index:9;
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
  transition:transform .25s cubic-bezier(.22,.61,.36,1), background-color .25s, border-color .25s;
 }
 .theme-btn:hover{transform:translateY(-1px)}
 .theme-btn:active{transform:scale(.94)}
 .theme-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
 .theme-btn .moon{display:none}
 [data-theme="dark"] .theme-btn .moon{display:block}
 [data-theme="dark"] .theme-btn .sun{display:none}

 .head{text-align:center;padding:8px 0 26px}
 .avatar{
  width:92px;height:92px;border-radius:50%;object-fit:cover;background:var(--card);
  box-shadow:0 0 0 4px var(--bg), 0 10px 28px -12px rgba(0,0,0,.45);
 }
 h1{font-size:22px;font-weight:650;letter-spacing:.01em;margin:16px 0 0}
 .tagline{margin:6px 0 0;color:var(--sub);font-size:13.5px}
 .chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:14px}
 .chips span{
  font-size:11.5px;color:var(--sub);background:var(--chip);border:1px solid var(--line);
  padding:3px 11px;border-radius:999px;letter-spacing:.04em;
 }
 .links{display:flex;flex-direction:column;gap:10px;margin-top:6px}
 .row{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:12px 16px 12px 12px;text-decoration:none;color:var(--ink);
  box-shadow:var(--shadow);
  transition:transform .28s cubic-bezier(.22,.61,.36,1), box-shadow .28s, border-color .28s, background-color .28s;
 }
 .row:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:rgba(120,130,150,.22)}
 .row:active{transform:translateY(0) scale(.995)}
 .ico{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
 .ico svg{width:20px;height:20px;fill:none;stroke-width:1.6;stroke-linecap:round}
 .txt{min-width:0}
 .txt b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
 .arrow{margin-left:auto;color:#c3c6cf;display:flex;align-items:center}
 [data-theme="dark"] .arrow{color:#5a616c}
 .num{margin-left:auto;font-size:13px;color:var(--sub);letter-spacing:.02em}
 .num + .arrow{margin-left:10px}
 .arrow svg{width:15px;height:15px}
 .ico.bili{background:var(--ico1)}  .ico.bili svg{stroke:#FB7299}
 .ico.dy{background:var(--ico2)}    .ico.dy svg{stroke:#fe2c55}
 .ico.xhs{background:var(--ico3)}   .ico.xhs svg{stroke:#FF2E4D}
 .ico.qq{background:var(--ico4)}    .ico.qq svg{stroke:#3B82F6}
 .ico.star{background:var(--ico2)}  .ico.star svg{stroke:var(--ink);opacity:.75}
 .feature{border-color:rgba(120,130,150,.16)}
 .qq.flat{box-shadow:none;background:transparent;border-style:dashed;border-color:rgba(120,130,150,.22)}
 footer{text-align:center;color:var(--sub);opacity:.65;font-size:11.5px;margin-top:28px}

 ::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
 ::view-transition-old(root){z-index:1}
 ::view-transition-new(root){z-index:2}

 @media (prefers-reduced-motion:reduce){
  .page{animation:none}
  .row,.theme-btn{transition:none}
 }
</style>
</head>
<body>

<script>
 function copyGroup(){
  var n = '962209952';
  var el = document.getElementById('groupNo');
  var old = el.textContent;
  var done = function(){ el.textContent = '已复制'; setTimeout(function(){ el.textContent = old; }, 1600); };
  if (navigator.clipboard) { navigator.clipboard.writeText(n).then(done).catch(done); } else { done(); }
  return false;
 }

 (function(){
  var root = document.documentElement;
  var btn = document.getElementById('themeBtn');
  var setTheme = function(next){
   root.dataset.theme = next;
   try { localStorage.setItem('yllld-theme', next); } catch (e) {}
   var meta = document.querySelector('meta[name="theme-color"]');
   if (meta) meta.setAttribute('content', next === 'dark' ? '#0a0b0e' : '#f5f5f7');
  };
  btn.addEventListener('click', function(){
   var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
   if (!document.startViewTransition) { setTheme(next); return; }
   var r = btn.getBoundingClientRect();
   var cx = r.left + r.width / 2;
   var cy = r.top + r.height / 2;
   var radius = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
   var vt = document.startViewTransition(function(){ setTheme(next); });
   vt.ready.then(function(){
    document.documentElement.animate(
     { clipPath: ['circle(0px at ' + cx + 'px ' + cy + 'px)', 'circle(' + radius + 'px at ' + cx + 'px ' + cy + 'px)'] },
     { duration: 560, easing: 'cubic-bezier(.35,.05,.2,1)', pseudoElement: '::view-transition-new(root)', fill: 'both' }
    );
   });
  });
 })();
</script>
